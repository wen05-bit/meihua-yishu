<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>觀梅 · 梅花易數起卦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141a;
    --bg2:#1b1e26;
    --paper:#ece3cd;
    --paper-shadow:#c9bd9c;
    --ink:#2a251e;
    --cinnabar:#b7402a;
    --gold:#c9a227;
    --jade:#4c6b54;
    --mist:#8b9099;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #232838 0%, transparent 55%),
      radial-gradient(ellipse at 100% 100%, #1a2a24 0%, transparent 50%),
      var(--bg);
    color:var(--mist);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{text-align:center;margin-bottom:52px;}
  .eyebrow{
    font-size:12px;letter-spacing:0.35em;color:var(--gold);
    text-transform:uppercase;font-weight:500;margin-bottom:14px;
  }
  h1{
    font-family:'Noto Serif TC',serif;font-weight:700;
    font-size:42px;color:#f2ead6;letter-spacing:0.08em;
    margin-bottom:10px;
  }
  header p{font-size:14px;color:var(--mist);letter-spacing:0.02em;line-height:1.8;}

  .nav-tabs{display:flex;gap:6px;margin-bottom:24px;border-bottom:1px solid #2a2f3a;}

  .auth-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:10px 16px;margin-bottom:14px;border-radius:4px;
    background:rgba(201,162,39,0.06);border:1px solid #2a2f3a;
  }
  .auth-status{font-size:12.5px;color:var(--mist);letter-spacing:0.03em;}
  .auth-status.signed-in{color:var(--gold);}
  .auth-migrate{font-size:12px;color:var(--jade);cursor:pointer;text-decoration:underline;letter-spacing:0.03em;}
  .auth-btn{
    padding:7px 16px;border-radius:3px;border:1px solid var(--gold);background:transparent;
    color:var(--gold);font-size:12.5px;letter-spacing:0.05em;cursor:pointer;transition:all .2s;
  }
  .auth-btn:hover{background:var(--gold);color:#2a251e;}
  .auth-btn.signed-in{border-color:#565b66;color:var(--mist);}
  .auth-btn.signed-in:hover{background:#565b66;color:#f2ead6;}
  .nav-tab{
    padding:11px 22px;font-size:14px;color:var(--mist);cursor:pointer;user-select:none;
    letter-spacing:0.1em;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;
  }
  .nav-tab:hover{color:var(--gold);}
  .nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  .history-toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .history-count{font-size:12px;color:#565b66;letter-spacing:0.05em;}
  .history-clear{font-size:12px;color:var(--cinnabar);cursor:pointer;letter-spacing:0.05em;user-select:none;}
  .history-clear:hover{text-decoration:underline;}

  .hist-empty{text-align:center;color:#565b66;font-size:13px;padding:40px 20px;letter-spacing:0.05em;}

  .hist-card{
    position:relative;background:var(--paper);border-radius:4px;padding:20px 24px;
    margin-bottom:14px;color:var(--ink);box-shadow:0 10px 24px -14px rgba(0,0,0,0.5), inset 0 0 0 1px var(--paper-shadow);
  }
  .hist-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
  .hist-when{font-size:11.5px;color:#6b6250;letter-spacing:0.05em;}
  .hist-badges{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .hist-tag{font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(76,107,84,0.12);color:var(--jade);letter-spacing:0.05em;}
  .hist-lv{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:12px;padding:2px 11px;border-radius:999px;color:#f2ead6;
  }
  .hist-lv.lv-good{background:var(--jade);}
  .hist-lv.lv-mid{background:var(--gold);color:#2a251e;}
  .hist-lv.lv-bad{background:var(--cinnabar);}
  .hist-del{color:#b0a688;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex-shrink:0;}
  .hist-del:hover{color:var(--cinnabar);}
  .hist-q{font-size:14px;color:#3a3428;margin-bottom:10px;line-height:1.6;}
  .hist-q.empty{color:#9a917a;font-style:italic;}
  .hist-gua{
    font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px;
  }
  .hist-gua .arrow{color:#9a917a;font-weight:400;margin:0 6px;font-family:sans-serif;}
  .hist-detail{font-size:12.5px;color:#6b6250;line-height:2;}
  .hist-detail b{color:var(--cinnabar);}

  .card{
    background:linear-gradient(180deg,#181c24,#14171e);
    border:1px solid #2a2f3a;
    border-radius:4px;
    padding:36px;
    margin-bottom:28px;
  }

  label.field-label{
    display:block;font-size:12px;color:var(--gold);letter-spacing:0.15em;
    margin-bottom:10px;text-transform:uppercase;
  }
  textarea{
    width:100%;background:#0e1015;border:1px solid #2a2f3a;border-radius:3px;
    color:#e8e2d0;font-family:'Noto Sans TC',sans-serif;font-size:15px;
    padding:14px 16px;min-height:70px;resize:vertical;line-height:1.7;
    outline:none;transition:border-color .25s;
  }
  textarea:focus{border-color:var(--gold);}
  textarea::placeholder{color:#565b66;}

  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px;}
  .chip{
    padding:8px 18px;border:1px solid #333846;border-radius:999px;
    font-size:13px;color:var(--mist);cursor:pointer;user-select:none;
    transition:all .2s;background:transparent;
  }
  .chip:hover{border-color:var(--gold);color:var(--gold);}
  .chip.active{background:var(--cinnabar);border-color:var(--cinnabar);color:#f2ead6;}

  .time-toggle{display:flex;gap:10px;margin-bottom:14px;}
  .ttoggle{
    flex:1;text-align:center;padding:10px 14px;border:1px solid #333846;border-radius:3px;
    font-size:13px;color:var(--mist);cursor:pointer;user-select:none;transition:all .2s;
    letter-spacing:0.08em;
  }
  .ttoggle:hover{border-color:var(--gold);color:var(--gold);}
  .ttoggle.active{background:rgba(201,162,39,0.12);border-color:var(--gold);color:var(--gold);}
  .time-input{
    display:none;width:100%;background:#0e1015;border:1px solid #2a2f3a;border-radius:3px;
    color:#e8e2d0;font-family:'Noto Sans TC',sans-serif;font-size:14px;
    padding:12px 14px;margin-bottom:22px;outline:none;transition:border-color .25s;
    color-scheme:dark;
  }
  .time-input:focus{border-color:var(--gold);}
  .time-input.show{display:block;}

  .cast-btn{
    width:100%;padding:16px;background:var(--cinnabar);border:none;border-radius:3px;
    color:#f2ead6;font-family:'Noto Serif TC',serif;font-size:17px;letter-spacing:0.25em;
    cursor:pointer;transition:filter .2s, transform .1s;font-weight:600;
  }
  .cast-btn:hover{filter:brightness(1.12);}
  .cast-btn:active{transform:scale(0.99);}
  .cast-hint{text-align:center;font-size:12px;color:#565b66;margin-top:10px;letter-spacing:0.05em;}

  /* ---- result ---- */
  #result{display:none;}
  .seal{
    position:absolute;top:26px;right:26px;width:52px;height:52px;
    border:2px solid var(--cinnabar);border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:var(--cinnabar);font-family:'Noto Serif TC',serif;font-size:13px;
    letter-spacing:2px;writing-mode:vertical-rl;opacity:0;transform:rotate(-6deg) scale(1.4);
    transition:opacity .5s ease .9s, transform .5s ease .9s;
  }
  .seal.show{opacity:0.85;transform:rotate(-6deg) scale(1);}

  .paper-card{
    position:relative;background:var(--paper);border-radius:4px;
    padding:38px 34px 30px;color:var(--ink);
    box-shadow:0 18px 40px -14px rgba(0,0,0,0.55), inset 0 0 0 1px var(--paper-shadow);
    margin-bottom:24px;
  }
  .gua-title{
    font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:0.3em;
    color:var(--cinnabar);text-transform:uppercase;margin-bottom:6px;
  }
  .lunar-line{font-size:12px;color:#6b6250;letter-spacing:0.08em;margin-bottom:22px;}

  .hexblock{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap;}
  .lines-col{display:flex;flex-direction:column-reverse;gap:10px;width:150px;}
  .yao{position:relative;height:12px;}
  .yao .bar{
    position:absolute;top:0;height:12px;background:var(--ink);border-radius:2px;
    width:0;transition:width .55s cubic-bezier(.2,.8,.2,1);
  }
  .yao .bar.left{left:0;}
  .yao .bar.right{right:0;}
  .yao.moving .bar{background:var(--cinnabar);}
  .yao .mark{
    position:absolute;right:-26px;top:-4px;color:var(--cinnabar);font-size:18px;
    font-family:'Noto Serif TC',serif;opacity:0;transition:opacity .3s ease .6s;
  }
  .yao.moving .mark{opacity:1;}

  .gua-meta{flex:1;min-width:200px;}
  .gua-meta .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--paper-shadow);font-size:14px;}
  .gua-meta .row:last-child{border-bottom:none;}
  .gua-meta .k{color:#6b6250;letter-spacing:0.1em;font-size:12px;}
  .gua-meta .v{font-family:'Noto Serif TC',serif;font-weight:600;font-size:16px;}
  .tag-ti{color:var(--jade);}
  .tag-yong{color:var(--cinnabar);}

  .verdict-box{
    margin:26px 0 20px;padding:22px 22px 6px;
    background:rgba(76,107,84,0.06);border:1px solid var(--paper-shadow);border-radius:4px;
  }
  .vb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .vb-decision{
    font-size:15px;font-weight:700;padding:12px 16px;border-radius:3px;margin-bottom:18px;
    border-left:3px solid var(--paper-shadow);background:rgba(0,0,0,0.02);line-height:1.7;
  }
  .vb-decision b{font-family:'Noto Serif TC',serif;}
  .vb-decision.lv-good{border-left-color:var(--jade);background:rgba(76,107,84,0.08);color:#2f4a37;}
  .vb-decision.lv-mid{border-left-color:var(--gold);background:rgba(201,162,39,0.1);color:#5c4a12;}
  .vb-decision.lv-bad{border-left-color:var(--cinnabar);background:rgba(183,64,42,0.08);color:#7a2c1e;}
  .vb-title{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;color:var(--ink);
    letter-spacing:0.15em;
  }
  .vb-badge{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;
    padding:5px 18px;border-radius:999px;letter-spacing:0.1em;
  }
  .vb-badge.lv-good{background:var(--jade);color:#f2ead6;}
  .vb-badge.lv-mid{background:var(--gold);color:#2a251e;}
  .vb-badge.lv-bad{background:var(--cinnabar);color:#f2ead6;}
  .vb-row{margin-bottom:16px;}
  .vb-k{
    display:block;font-size:12px;color:var(--jade);letter-spacing:0.15em;
    font-weight:600;margin-bottom:6px;
  }
  .vb-row p{font-size:14.5px;line-height:1.9;color:#3a3428;}
  .vb-row p b{color:var(--cinnabar);font-family:'Noto Serif TC',serif;font-weight:600;}

  .verdict{
    display:flex;align-items:center;gap:14px;margin:0 0 18px;padding:14px 18px;
    background:rgba(183,64,42,0.08);border-left:3px solid var(--cinnabar);border-radius:2px;
  }
  .verdict .lv{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;color:var(--cinnabar);}
  .verdict .rel{font-size:12.5px;color:#6b6250;letter-spacing:0.05em;}
  .rel-label{color:#8a8069;margin-right:8px;padding-right:8px;border-right:1px solid var(--paper-shadow);}

  .interp{font-size:15px;line-height:2;color:#3a3428;}
  .interp b{color:var(--cinnabar);font-weight:600;}

  .change-note{
    margin-top:20px;padding-top:18px;border-top:1px solid var(--paper-shadow);
    font-size:13px;color:#6b6250;line-height:1.9;
  }
  .change-note b{color:var(--ink);}

  .yao-note{
    margin-top:20px;padding-top:18px;border-top:1px solid var(--paper-shadow);
  }
  .yao-head{
    font-family:'Noto Serif TC',serif;font-size:13px;font-weight:600;color:var(--jade);
    letter-spacing:0.15em;margin-bottom:10px;
  }
  .yao-ci-quote{
    font-family:'Noto Serif TC',serif;font-size:15px;color:var(--ink);line-height:1.9;
    padding:12px 16px;margin-bottom:14px;background:rgba(76,107,84,0.05);
    border-left:2px solid var(--jade);letter-spacing:0.03em;
  }
  .yao-ci-quote .yc-name{color:var(--jade);font-weight:600;margin-right:6px;}
  .yao-ci-quote .yc-source{display:block;font-family:'Noto Sans TC',sans-serif;font-size:11px;color:#9a917a;margin-top:6px;letter-spacing:0.05em;}
  .yao-ci-quote .yc-terms{display:block;font-family:'Noto Sans TC',sans-serif;font-size:12px;color:#6b6250;margin-top:8px;line-height:1.8;}
  .yao-ci-quote .yc-terms b{color:var(--cinnabar);font-family:'Noto Serif TC',serif;}
  .yao-body{font-size:13.5px;color:#3a3428;line-height:2;}
  .yao-body b{color:var(--jade);font-family:'Noto Serif TC',serif;}
  .yao-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .yao-tag{
    font-size:11.5px;padding:3px 11px;border-radius:999px;letter-spacing:0.05em;
    border:1px solid var(--paper-shadow);color:#6b6250;
  }
  .yao-tag.pos{border-color:var(--jade);color:var(--jade);background:rgba(76,107,84,0.08);}
  .yao-tag.neg{border-color:var(--cinnabar);color:var(--cinnabar);background:rgba(183,64,42,0.06);}

  .calc-toggle{
    margin-top:20px;padding-top:16px;border-top:1px solid var(--paper-shadow);
    font-size:13px;color:var(--jade);cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:6px;letter-spacing:0.05em;
  }
  .calc-toggle:hover{color:var(--cinnabar);}
  .calc-toggle .arrow{transition:transform .25s;font-size:10px;}
  .calc-toggle.open .arrow{transform:rotate(180deg);}
  .calc-panel{
    display:none;margin-top:16px;padding:18px 20px;background:rgba(42,37,30,0.04);
    border:1px solid var(--paper-shadow);border-radius:3px;
  }
  .calc-step{margin-bottom:14px;}
  .calc-step:last-of-type{margin-bottom:0;}
  .calc-label{
    font-family:'Noto Serif TC',serif;font-size:12px;font-weight:600;color:var(--cinnabar);
    letter-spacing:0.1em;margin-bottom:5px;
  }
  .calc-eq{
    font-family:'SFMono-Regular',Consolas,'Noto Sans TC',monospace;font-size:13px;
    color:#3a3428;line-height:1.9;word-break:break-all;
  }
  .calc-eq b{color:var(--jade);font-family:'Noto Serif TC',serif;}
  .calc-note{
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--paper-shadow);
    font-size:12px;color:#6b6250;letter-spacing:0.03em;line-height:1.8;
  }

  .disclaimer{text-align:center;font-size:12px;color:#464b56;margin-top:30px;letter-spacing:0.03em;line-height:1.8;}

  @media (max-width:520px){
    h1{font-size:32px;}
    .card{padding:24px;}
    .hexblock{gap:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">觀梅 · 心易天機</div>
    <h1>梅花易數</h1>
    <p>「萬物皆有數，心動即天機。」<br>誠心一念，依當下時刻起卦，體用生克，自見端倪。</p>
  </header>

  <div class="auth-bar" id="authBar">
    <span class="auth-status" id="authStatus">尚未登入・紀錄僅存在本機瀏覽器</span>
    <span class="auth-migrate" id="authMigrate" style="display:none"></span>
    <button class="auth-btn" id="authBtn">使用 Google 登入</button>
  </div>

  <div class="nav-tabs">
    <div class="nav-tab active" data-tab="cast">起卦</div>
    <div class="nav-tab" data-tab="history">占卜紀錄</div>
  </div>

  <div id="castView">

  <div class="card">
    <label class="field-label">誠心發問</label>
    <textarea id="question" placeholder="心中所繫之事，簡述於此……（例如：這件事近期會有轉機嗎？）"></textarea>

    <div class="chips" id="chips">
      <div class="chip" data-c="財運">財運</div>
      <div class="chip" data-c="事業">事業</div>
      <div class="chip" data-c="感情">感情</div>
      <div class="chip" data-c="健康">健康</div>
    </div>

    <label class="field-label">起卦時間</label>
    <div class="time-toggle" id="timeToggle">
      <div class="ttoggle active" data-t="now">當下起卦</div>
      <div class="ttoggle" data-t="custom">擇時起卦</div>
    </div>
    <input type="datetime-local" id="customTime" class="time-input" min="1900-02-01" max="2100-12-31">

    <button class="cast-btn" id="castBtn">起　　卦</button>
    <div class="cast-hint" id="castHint">以起卦當下之年月日時起數，一事一占，心誠則靈</div>
  </div>

  <div id="result">
    <div class="paper-card">
      <div class="seal" id="seal">誠意<br>正心</div>
      <div class="gua-title">本卦 · <span id="benguaName"></span></div>
      <div class="lunar-line" id="lunarDate"></div>
      <div class="yao-ci-quote" id="guaCiQuote"></div>
      <div class="hexblock">
        <div class="lines-col" id="lines"></div>
        <div class="gua-meta">
          <div class="row"><span class="k">上卦（外）</span><span class="v" id="upperName"></span></div>
          <div class="row"><span class="k">下卦（內）</span><span class="v" id="lowerName"></span></div>
          <div class="row"><span class="k">互卦</span><span class="v" id="huGuaRow"></span></div>
          <div class="row"><span class="k">動爻</span><span class="v" id="movingLine"></span></div>
          <div class="row"><span class="k">體卦</span><span class="v tag-ti" id="tiGua"></span></div>
          <div class="row"><span class="k">用卦</span><span class="v tag-yong" id="yongGua"></span></div>
          <div class="row"><span class="k">方位</span><span class="v" id="directionRow"></span></div>
        </div>
      </div>

      <div class="verdict-box" id="verdictBox">
        <div class="vb-head">
          <span class="vb-title">綜合斷卦</span>
          <span class="vb-badge" id="vbBadge"></span>
        </div>
        <div class="vb-decision" id="vbDecision"></div>
        <div class="vb-row"><span class="vb-k">事情走向</span><p id="vbTrend"></p></div>
        <div class="vb-row"><span class="vb-k">關鍵信號與時間</span><p id="vbSignal"></p></div>
        <div class="vb-row"><span class="vb-k">行動建議</span><p id="vbAction"></p></div>
      </div>

      <div class="verdict">
        <div class="lv" id="verdictLevel"></div>
        <div class="rel"><span class="rel-label">判斷依據</span><span id="verdictRel"></span></div>
      </div>

      <div class="interp" id="interpText"></div>

      <div class="change-note" id="changeNote"></div>

      <div class="yao-note" id="yaoNote">
        <div class="yao-head">動爻解法</div>
        <div class="yao-ci-quote" id="yaoCiQuote"></div>
        <div class="yao-tags" id="yaoTags"></div>
        <div class="yao-body" id="yaoBody"></div>
      </div>

      <div class="calc-toggle" id="calcToggle">
        <span class="arrow">▾</span>
        <span>顯示詳細推算過程</span>
      </div>
      <div class="calc-panel" id="calcPanel"></div>
    </div>
    <div class="disclaimer">此卦依傳統梅花易數體用生克規則生成，農曆年月日採標準陰曆演算法精確換算，上下卦名對照文王六十四卦序。內容僅供參考與自我覺察，非宿命定論。</div>
  </div>

  </div>

  <div id="historyView" style="display:none">
    <div class="card">
      <label class="field-label">搜尋紀錄</label>
      <input type="text" id="historySearch" class="time-input show" placeholder="搜尋問題內容、卦名或分類……" style="margin-bottom:16px;">

  {term:'咎', gloss:'咎，會招來過失或責難'}
];
function annotateJudgmentTerms(text){
  const found = [];
  const used = new Set();
  for(const {term, gloss} of JUDGMENT_TERMS){
    if(text.includes(term) && !used.has(term)){
      // 避免「無咎」被拆成「咎」重複標注
      if((term==='咎' && (text.includes('無咎')||text.includes('无咎'))) ) continue;
      if((term==='凶'||term==='兇') && used.has('貞兇')) continue;
      found.push({term, gloss});
      used.add(term);
    }
  }
  return found;
}

  [['無交害，匪咎；艱則無咎。','大車以載，有攸往，無咎。','公用亨於天子，小人弗克。','匪其彭，無咎。','厥孚交如，威如，吉。','自天祐之，吉無不利。'],['悔亡；喪馬勿逐，自復；見惡人，無咎。','遇主於巷，無咎。','見輿曳，其牛掣；其人天且劓。無初有終。','睽孤，遇元夫，交孚，厲無咎。','悔亡，厥宗噬膚，往何咎？','睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧；匪寇婚媾，往遇雨則吉。'],['履錯然，敬之，無咎。','黃離，元吉。','日昃之離，不鼓缶而歌，則大耋之嗟，兇。','突如其來如，焚如，死如，棄如。','出涕沱若，戚嗟若，吉。','王用出徵，有嘉折首，獲匪其醜，無咎。'],['屨校滅趾，無咎。','噬膚滅鼻，無咎。','噬臘肉，遇毒；小吝，無咎。','噬幹胏，得金矢；利艱貞，吉。','噬乾肉，得黃金，貞厲，無咎。','何校滅耳，兇。'],['鼎顛趾，利出否；得妾以其子，無咎。','鼎有實，我仇有疾，不我能即，吉。','鼎耳革，其行塞。雉膏不食；方雨虧悔，終吉。','鼎折足，覆公餗，其形渥，兇。','鼎黃耳，金鉉，利貞。','鼎玉鉉，大吉，無不利。'],['濡其尾，吝。','曳其輪，貞吉。','未濟，徵兇，利涉大川。','貞吉，悔亡；震用伐鬼方，三年有賞於大國。','貞吉，無悔；君子之光，有孚，吉。','有孚於飲酒；無咎，濡其首，有孚失是。'],['旅瑣瑣，斯其所取災。','旅即次，懷其資，得童僕，貞。','旅焚其次，喪其童僕，貞厲。','旅於處，得其資斧，我心不快。','射雉，一矢亡；終以譽命。','鳥焚其巢，旅人先笑後號啕；喪牛於易，兇。'],['晉如摧如，貞吉。罔孚，裕無咎。','晉如愁如，貞吉，受茲介福，於其王母。','衆允，悔亡。','晉如鼫鼠，貞厲。','悔亡，失得勿恤，往吉，無不利。','晉其角，維用伐邑，厲吉無咎。貞吝。']],
  [['壯於趾，徵兇，有孚。','貞吉。','小人用壯，君子用罔；貞厲。羝羊觸藩，羸其角。','貞吉，悔亡；藩決不羸，壯於大輿之輹。','喪羊於易，無悔。','羝羊觸藩，不能退，不能遂，無攸利；艱則吉。'],['歸妹以娣，跛能履，徵吉。','眇能視，利幽人之貞。','歸妹以須，反歸以娣。','歸妹愆期，遲歸有時。','帝乙歸妹，其君之袂，不如其娣之袂良；月幾望，吉。','女承筐，無實；士刲羊，無血。無攸利。'],['遇其配主，雖旬無咎，往有尚。','豐其蔀，日中見鬥。往得疑疾，有孚發若，吉。','豐其沛，日中見沬；折其右肱，無咎。','豐其蔀，日中見鬥，遇其夷主，吉。','來章，有慶譽，吉。','豐其屋，蔀其家，窺其戶，闃其無人，三歲不覿，兇。'],['震來虩虩，後笑言啞啞，吉。','震來厲，億喪貝，躋於九陵，勿逐，七日得。','震蘇蘇，震行無眚。','震遂泥。','震往來，厲；億無喪，有事。','震索索，視矍矍，徵兇。震不於其躬，於其鄰，無咎。婚媾有言。'],['浚恆，貞兇，無攸利。','悔亡。','不恆其德，或承之羞；貞吝。','田無禽。','恆其德，貞；婦人吉，夫子兇。','振恆，兇。'],['無咎。','田獲三狐，得黃矢；貞吉。','負且乘，致寇至，貞吝。','解而拇，朋至斯孚。','君子維有解，吉，有孚於小人。','公用射隼於高墉之上，獲之，無不利。'],['飛鳥以兇。','過其祖，遇其妣；不及其君，遇其臣，無咎。','弗過防之，從或戕之，兇。','無咎，弗過遇之；往厲必戒，勿用永貞。','密雲不雨，自我西郊；公弋取彼在穴。','弗遇過之；飛鳥離之，兇，是謂災眚。'],['鳴豫，兇。','介於石，不終日，貞吉。','盱豫，悔。遲有悔。','由豫，大有得；勿疑。朋盍簪。','貞疾，恆不死。','冥豫，成有渝，無咎。']],
  [['復自道，何其咎？吉。','牽復，吉。','輿說輻，夫妻反目。','有孚，血去惕出，無咎。','有孚攣如，富以其鄰。','既雨既處，尚德載；婦貞厲，月幾望；君子徵兇。'],['虞吉，有他不燕。','鳴鶴在陰，其子和之；我有好爵，吾與爾靡之。','得敵，或鼓或罷，或泣或歌。','月幾望，馬匹亡，無咎。','有孚攣如，無咎。','翰音登於天，貞兇。'],['閒有家，悔亡。','無攸遂，在中饋，貞吉。','家人嗃嗃，悔厲，吉；婦子嘻嘻，終吝。','富家，大吉。','王假有家，勿恤，吉。','有孚，威如，終吉。'],['利用爲大作，元吉，無咎。','或益之十朋之龜，弗克違。永貞吉；王用享於帝，吉。','益之用凶事，無咎；有孚中行，告公用圭。','中行，告公從，利用爲依遷國。','有孚惠心，勿問元吉。有孚惠我德。','莫益之，或擊之，立心勿恆，兇。'],['進退，利武人之貞。','巽在牀下，用史巫紛若，吉，無咎。','頻巽，吝。','悔亡，田獲三品。','貞吉，悔亡，無不利。無初有終。先庚三日，後庚三日，吉。','巽在牀下，喪其資斧，貞兇。'],['用拯馬壯，吉。','渙奔其機，悔亡。','渙其躬，無悔。','渙其羣，元吉；渙有丘，匪夷所思。','渙汗其大號，渙王居，無咎。','渙其血去逖出，無咎。'],['鴻漸於幹；小子厲，有言，無咎。','鴻漸於磐，飲食衎衎，吉。','鴻漸於陸，夫徵不復，婦孕不育，兇；利禦寇。','鴻漸於木，或得其桷，無咎。','鴻漸於陵，婦三歲不孕；終莫之勝，吉。','鴻漸於陸，其羽可用爲儀，吉。'],['童觀，小人無咎，君子吝。','窺觀，利女貞。','觀我生，進退。','觀國之光，利用賓於王。','觀我生，君子無咎。','觀其生，君子無咎。']],
  [['需於郊，利用恆，無咎。','需於沙，小有言；終吉。','需於泥，致寇至。','需於血，出自穴。','需於酒食，貞吉。','入於穴，有不速之客三人來；敬之，終吉。'],['不出戶庭，無咎。','不出門庭，兇。','不節若，則嗟若，無咎。','安節，亨。','甘節，吉。往有尚。','苦節，貞兇，悔亡。'],['曳其輪，濡其尾，無咎。','婦喪其茀，勿逐，七日得。','高宗伐鬼方，三年克之；小人勿用。','繻有衣袽，終日戒。','東鄰殺牛，不如西鄰之禴祭，實受其福。','濡其首，厲。'],['磐桓；利居貞，利建侯。','屯如，邅如，乘馬班如。匪寇婚媾。女子貞不字，十年乃字。','即鹿無虞，惟入於林中，君子幾，不如舍，往吝。','乘馬班如，求婚媾，往吉，無不利。','屯其膏，小貞吉，大貞兇。','乘馬班如，泣血漣如。'],['井泥不食，舊井無禽。','井谷射鮒，甕敝漏。','井渫不食，爲我心惻；可用汲，王明，並受其福。','井甃，無咎。','井冽，寒泉食。','井收勿幕，有孚元吉。'],['習坎，入於坎窞，兇。','坎有險，求小得。','來之坎坎，險且枕，入於坎窞，勿用。','樽酒，簋貳，用缶，納約自牖，終無咎。','坎不盈，祗既平，無咎。','係用徽纆，寘於叢棘，三歲不得，兇。'],['往蹇，來譽。','王臣蹇蹇，匪躬之故。','往蹇，來反。','往蹇，來連。','大蹇，朋來。','往蹇，來碩；吉，利見大人。'],['有孚比之，無咎；有孚盈缶，終來有它，吉。','比之自內，貞吉。','比之匪人。','外比之，貞吉。','顯比；王用三驅，失前禽。邑人不誡，吉。','比之無首，兇。']],
  [['有厲，利已。','輿說輹。','良馬逐，利艱貞。曰閒輿衛，利有攸往。','童牛之牿，元吉。','豶豕之牙，吉。','何天之衢，亨。'],['已事遄往，無咎；酌損之。','利貞，徵兇；弗損益之。','三人行，則損一人；一人行，則得其友。','損其疾，使遄有喜，無咎。','或益之十朋之龜，弗克違，元吉。','弗損益之，無咎。貞吉，利有攸往，得臣無家。'],['賁其趾，舍車而徒。','賁其須。','賁如，濡如，永貞吉。','賁如，皤如，白馬翰如，匪寇，婚媾。','賁於丘園，束帛戔戔；吝，終吉。','白賁，無咎。'],['舍爾靈龜，觀我朵頤，兇。','顛頤；拂經於丘頤，徵兇。','拂頤；貞兇，十年勿用；無攸利。','顛頤，吉；虎視眈眈，其欲逐逐，無咎。','拂經；居貞吉，不可涉大川。','由頤；厲吉，利涉大川。'],['幹父之蠱，有子，考無咎，厲終吉。','幹母之蠱，不可貞。','幹父之蠱，小有悔，無大咎。','裕父之蠱，往見吝。','幹父之蠱，用譽。','不事王侯，高尚其事。'],['發矇，利用刑人，用說桎梏；以往吝。','包蒙，吉。納婦，吉；子克家。','勿用取女，見金夫，不有躬，無攸利。','困蒙，吝。','童蒙，吉。','擊蒙；不利爲寇，利禦寇。'],['艮其趾，無咎，利永貞。','艮其腓，不拯其隨，其心不快。','艮其限，列其夤，厲燻心。','艮其身，無咎。','艮其輔，言有序，悔亡。','敦艮，吉。'],['剝牀以足，蔑貞；兇。','剝牀以辨，蔑貞兇。','剝之，無咎。','剝牀以膚，兇。','貫魚以宮人寵，無不利。','碩果不食，君子得輿，小人剝廬。']],
  [['拔茅茹，以其匯，徵吉。','包荒，用馮河，不遐遺；朋亡，得尚於中行。','無平不陂，無往不復；艱貞無咎，勿恤其孚，於食有福。','翩翩，不富，以其鄰，不戒以孚。','帝乙歸妹，以祉元吉。','城復於隍，勿用師，自邑告命，貞吝。'],['鹹臨，貞吉。','鹹臨，吉，無不利。','甘臨，無攸利；既憂之，無咎。','至臨，無咎。','知臨，大君之宜，吉。','敦臨，吉，無咎。'],['明夷于飛，垂其翼；君子於行，三日不食。有攸往，主人有言。','明夷，夷於左股，用拯馬壯，吉。','明夷於南狩，得其大首。不可疾貞。','入於左腹，獲明夷之心，於出門庭。','箕子之明夷，利貞。','不明晦，初登於天，後入於地。'],['不遠復，無祗悔，元吉。','休復，吉。','頻復，厲無咎。','中行獨復。','敦復，無悔。','迷復，兇，有災眚。用行師，終有大敗；以其國，君兇，至於十年不克徵。'],['允升，大吉。','孚乃利用禴，無咎。','升虛邑。','王用亨於岐山，吉無咎。','貞吉，升階。','冥升，利於不息之貞。'],['師出以律，否臧兇。','在師中吉，無咎；王三錫命。','師或輿尸，兇。','師左次，無咎。','田有禽，利執言，無咎；長子帥師，弟子輿尸，貞兇。','大君有命，開國承家，小人勿用。'],['謙謙君子，用涉大川，吉。','鳴謙，貞吉。','勞謙，君子有終，吉。','無不利，撝謙。','不富以其鄰，利用侵伐，無不利。','鳴謙，利用行師，徵邑國。'],['履霜，堅冰至。','直方大，不習無不利。','含章可貞；或從王事，無成有終。','括囊，無咎無譽。','黃裳，元吉。','龍戰於野，其血玄黃。']],
];

function lLeapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function lLeapDays(y){ return lLeapMonth(y) ? ((LUNAR_INFO[y-1900]&0x10000)?30:29) : 0; }
function lMonthDays(y,m){ return (LUNAR_INFO[y-1900] & (0x10000>>m)) ? 30 : 29; }
function lYearDays(y){
  let sum=348;
  for(let i=0x8000;i>0x8;i>>=1){ sum += (LUNAR_INFO[y-1900]&i)?1:0; }
  return sum + lLeapDays(y);
}
function solarToLunar(y,m,d){
  let offset = Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  let i, leap=0, temp=0;
  for(i=1900;i<2101 && offset>0;i++){ temp=lYearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  const year=i;
  leap = lLeapMonth(year);
  let isLeap=false;
  for(i=1;i<13 && offset>0;i++){
    if(leap>0 && i===(leap+1) && !isLeap){ --i; isLeap=true; temp=lLeapDays(year); }
    else { temp=lMonthDays(year,i); }
    if(isLeap && i===(leap+1)) isLeap=false;
    offset-=temp;
  }
  if(offset===0 && leap>0 && i===leap+1){
    if(isLeap){ isLeap=false; } else { isLeap=true; --i; }
  }
  if(offset<0){ offset+=temp; --i; }
  return { year:year, month:i, day:offset+1, isLeap:isLeap };
}
const STEMS=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const CN_NUM=['','一','二','三','四','五','六','七','八','九','十','十一','十二'];

// ---- 儒略日數（JDN）與日干支換算，用於推算精確的「逢X日」應期 ----
function toJDN(Y,M,D){
  const a = Math.floor((14-M)/12);
  const y = Y + 4800 - a;
  const m = M + 12*a - 3;
  return D + Math.floor((153*m+2)/5) + 365*y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) - 32045;
}
function dayGanZhi(Y,M,D){
  const jdn = toJDN(Y,M,D);
  const idx = ((jdn+49)%60+60)%60;
  return { stem: STEMS[idx%10], branch: BRANCHES[idx%12] };
}
function addDays(date, n){
  const d = new Date(date.getTime());
  d.setDate(d.getDate()+n);
  return d;
}
function fmtDate(d){
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtWeekday(d){
  return ['日','一','二','三','四','五','六'][d.getDay()];
}
function ganZhiYear(y){
  const s = (y-4)%10, b=(y-4)%12;
  return STEMS[(s+10)%10] + BRANCHES[(b+12)%12];
}
function cnMonthDay(m,day,isLeap){
  const dayNames=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
    '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
    '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  return (isLeap?'閏':'') + CN_NUM[m] + '月' + dayNames[day-1];
}

// ---- 動爻解法：傳統易經爻位理論（當位、中位、相應） ----
// 1、3、5爻為陽位，2、4、6爻為陰位；陽爻居陽位或陰爻居陰位稱「當位／得正」。
// 2、5爻為「中位」。1↔4、2↔5、3↔6互為「應」，陰陽相反則「相應」，相同則「不應」。
function classicalLineName(position, isYang){
  const yy = isYang ? '九' : '六';
  if(position===1) return '初'+yy;
  if(position===6) return '上'+yy;
  const num = {2:'二',3:'三',4:'四',5:'五'}[position];
  return yy+num;
}
function lineTheory(fullLines, position){
  const idx = position - 1;
  const val = fullLines[idx];
  const isYang = val === 1;
  const posIsYang = (position % 2 === 1);
  const proper = isYang === posIsYang;
  const isMiddle = (position === 2 || position === 5);
  const pairMap = {1:4, 2:5, 3:6, 4:1, 5:2, 6:3};
  const pairPos = pairMap[position];
  const pairVal = fullLines[pairPos-1];
  const pairIsYang = pairVal === 1;
  const responds = pairIsYang !== isYang;
  return {
    isYang, proper, isMiddle, responds,
    name: classicalLineName(position, isYang),
    pairPos, pairName: classicalLineName(pairPos, pairIsYang)
  };
}

const BRANCH_TARGETS = {
  '木':['寅','卯'], '火':['巳','午'], '土':['辰','戌','丑','未'], '金':['申','酉'], '水':['亥','子']
};
function nearestElementDay(baseDate, element){
  const targets = BRANCH_TARGETS[element];
  for(let i=1;i<=12;i++){
    const d = addDays(baseDate, i);
    const gz = dayGanZhi(d.getFullYear(), d.getMonth()+1, d.getDate());
    if(targets.includes(gz.branch)){
      return { date:d, stem:gz.stem, branch:gz.branch, offset:i };
    }
  }
  return null;
}

// ---- 五行旺相：當令月份對照，用於應期的第三種交叉驗證 ----
const ELEMENT_MONTHS = {'木':[1,2], '火':[4,5], '金':[7,8], '水':[10,11], '土':[3,6,9,12]};
const MONTH_BRANCH = ['','寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
function nearestSeasonMonth(currentMonth, element){
  const months = ELEMENT_MONTHS[element];
  let best = null, bestDist = 99;
  for(const m of months){
    const dist = (m - currentMonth + 12) % 12;
    if(dist < bestDist){ bestDist = dist; best = m; }
  }
  return { month: best, monthsAway: bestDist };
}

function buildVerdict(relKey, relLevel, moveLine, category, q, yongName, yongEl, yongIdx, baseDate, lunarMonth){
  const lv = LEVEL3[relLevel];
  const trend = TREND_BY_RELATION[relKey];

  const dc = DECISION_BY_LEVEL[lv.label];
  const decisionPrefix = q ? `針對「${q}」——` : '針對這件事——';
  const decision = `${decisionPrefix}<b>${dc.verdict}</b>。${dc.note}`;

  // 數字應期：用卦先天數 + 動爻數，往後推算對應天數的具體日期
  const N = yongIdx + moveLine;
  const numDate = addDays(baseDate, N);
  const numText = `數字法——用卦數＋動爻數（${yongIdx}＋${moveLine}＝${N}），往後推 ${N} 天，落在 <b>${fmtDate(numDate)}（週${fmtWeekday(numDate)}）</b>前後。`;

  // 干支應期：用卦五行所對應的地支日，最近一次出現的具體日期
  const ed = nearestElementDay(baseDate, yongEl);
  const gzText = ed ? `干支法——用卦「${yongName}」屬${yongEl}，最近一個相應的干支日是 <b>${fmtDate(ed.date)}（${ed.stem}${ed.branch}日）</b>。` : '';

  // 五行旺相：當令月份
  const season = nearestSeasonMonth(lunarMonth, yongEl);
  const seasonText = season.monthsAway === 0
    ? `旺相法——現在（農曆${lunarMonth}月）正是${yongName}（${yongEl}）當令的月份，三法裡這一項最直接印證。`
    : `旺相法——${yongName}（${yongEl}）要到農曆${season.month}月（${MONTH_BRANCH[season.month]}月）才轉旺，還要約 ${season.monthsAway} 個月。`;

  const signal = `${SIGNAL_BY_LINE[moveLine]}${TIMEFRAME_BY_LINE[moveLine]}。三種應期算法交叉看：${numText}${gzText}${seasonText}`;
  const catAction = (ACTION_CATEGORY[category] && ACTION_CATEGORY[category][lv.label]) || ACTION_CATEGORY_DEFAULT[lv.label];
  const action = `${ACTION_BASE[lv.label]}${catAction}`;
  const trendPrefix = q ? `針對「${q}」這件事：` : '';
  return { label: lv.label, cls: lv.cls, decision, decisionVerdict: dc.verdict, trend: trendPrefix + trend, signal, action, N, numDate, ed };
}

function hourToShichen(h){
  // 23-1子1, 1-3丑2 ... 每兩小時一時辰，共12
  const idx = Math.floor(((h+1)%24)/2);
  return idx+1;
}

  document.getElementById('result').style.display = 'block';

  document.getElementById('lunarDate').textContent = `${ganZhiYear(year)}年 ${cnMonthDay(month,day,lunar.isLeap)} · ${BRANCHES[hourNum-1]}時`;
  document.getElementById('guaCiQuote').innerHTML = `<span class="yc-name">卦辭</span>「${guaCi(upperIdx,lowerIdx)}」<span class="yc-source">《周易》${guaName(upperIdx,lowerIdx)}卦・原文</span>` +
    (annotateJudgmentTerms(guaCi(upperIdx,lowerIdx)).length ? `<span class="yc-terms">關鍵判斷字：${annotateJudgmentTerms(guaCi(upperIdx,lowerIdx)).map(t=>`<b>${t.term}</b>＝${t.gloss}`).join('；')}</span>` : '');
  document.getElementById('upperName').textContent = `${upper.name} ${upper.symbol}（${upper.nature}）`;
  document.getElementById('lowerName').textContent = `${lower.name} ${lower.symbol}（${lower.nature}）`;
  document.getElementById('huGuaRow').textContent = `${guaName(hu.upperIdx,hu.lowerIdx)}（${huUpper.name}上${huLower.name}下）`;
  document.getElementById('movingLine').textContent = `第 ${moveLine} 爻`;
  document.getElementById('tiGua').textContent = `${ti.name}（${ti.el}）`;
  document.getElementById('yongGua').textContent = `${yong.name}（${yong.el}）`;
  document.getElementById('directionRow').textContent = `體${ti.name}屬${TRIGRAM_DIRECTION[ti.name]}・用${yong.name}屬${TRIGRAM_DIRECTION[yong.name]}`;
  document.getElementById('verdictLevel').textContent = rel.level;
  document.getElementById('verdictRel').textContent = rel.rel + ' — ' + rel.note;


  const q = document.getElementById('question').value.trim();

  const yongIdx = isTi_lower ? upperIdx : lowerIdx;
  const vb = buildVerdict(rel.rel, rel.level, moveLine, activeCat, q, yong.name, yong.el, yongIdx, now, month);
  const vbBadge = document.getElementById('vbBadge');
  vbBadge.textContent = vb.label;
  vbBadge.className = 'vb-badge ' + vb.cls;
  const vbDecision = document.getElementById('vbDecision');
  vbDecision.innerHTML = vb.decision;
  vbDecision.className = 'vb-decision ' + vb.cls;
  document.getElementById('vbTrend').textContent = vb.trend;
  document.getElementById('vbSignal').innerHTML = vb.signal;
  document.getElementById('vbAction').textContent = vb.action;

  // 卦理說明：體/用角色依分類具體化、貼合問題情境，判斷邏輯純粹來自五行生克結構
  const role = TI_YONG_ROLE[activeCat] || TI_YONG_ROLE[''];
  const qClause = q ? `在你所問的「${q}」這件事上，` : '';
  const pathNote = `發展路徑：<b>${guaName(upperIdx,lowerIdx)}</b>（現況）→ <b>${guaName(hu.upperIdx,hu.lowerIdx)}</b>（過程中真正起作用的力量）→ <b>${guaName(cUpperIdx,cLowerIdx)}</b>（走向的結局）。本卦${upper.name}上${lower.name}下，互卦${huUpper.name}上${huLower.name}下，變卦${cUpper.name}上${cLower.name}下——這條路徑是同一組數字算出來的固定結果，不會因為你希望它怎麼發展而改變。`;
  const guaLi = `本卦為<b>${guaName(upperIdx,lowerIdx)}</b>（${upper.name}上${lower.name}下）。${qClause}體卦為<b>${ti.name}</b>（${ti.el}，${ti.trait}），對應${role.ti}；用卦為<b>${yong.name}</b>（${yong.el}，${yong.trait}），對應${role.yong}。兩者關係為<b>${rel.rel}</b>：${rel.note}。方位上，體${ti.name}屬${TRIGRAM_DIRECTION[ti.name]}、用${yong.name}屬${TRIGRAM_DIRECTION[yong.name]}，與這件事相關的人事、機緣偏向這兩個方向。<br><br>${pathNote}`;
  const guaLiApplied = q
    ? `<br><br>對照你問的「${q}」：${CATEGORY_NOTE[activeCat] || CATEGORY_NOTE['']}上面這套體用生克與發展路徑，就是卦象給出的結構性答案——它不會因為你想聽到哪種結果而不同。`
    : '';
  document.getElementById('interpText').innerHTML = guaLi + guaLiApplied;

  document.getElementById('changeNote').innerHTML =
    `第 ${moveLine} 爻動，變為 <b>${guaName(cUpperIdx,cLowerIdx)}</b>（${cUpper.name}上${cLower.name}下）——此為事態後續演變之勢，若初象未如意，亦可留意此變化方向。`;

  // 動爻解法：當位、中位、相應 ＋ 爻辭原文 ＋ 判斷用語釋義
  const lt = lineTheory(full, moveLine);
  const ciText = yaoCiText(upperIdx, lowerIdx, moveLine);
  const terms = annotateJudgmentTerms(ciText);
  document.getElementById('yaoCiQuote').innerHTML =
    `<span class="yc-name">${lt.name}</span>「${ciText}」<span class="yc-source">《周易》${guaName(upperIdx,lowerIdx)}卦・原文</span>` +
    (terms.length ? `<br><span class="yc-terms">關鍵判斷字：${terms.map(t=>`<b>${t.term}</b>＝${t.gloss}`).join('；')}</span>` : '');

  const yaoTagsHtml = [
    `<span class="yao-tag">${lt.name}　${lt.isYang?'陽爻（一）':'陰爻（--）'}</span>`,
    `<span class="yao-tag ${lt.proper?'pos':'neg'}">${lt.proper?'當位':'不當位'}</span>`,
    lt.isMiddle ? `<span class="yao-tag pos">居中位</span>` : '',
    `<span class="yao-tag ${lt.responds?'pos':'neg'}">與第${lt.pairPos}爻（${lt.pairName}）${lt.responds?'相應':'不相應'}</span>`
  ].join('');
  document.getElementById('yaoTags').innerHTML = yaoTagsHtml;
  document.getElementById('yaoBody').innerHTML =
    `本卦動爻為 <b>${lt.name}</b>，位居第 ${moveLine} 爻（${moveLine%2===1?'陽位':'陰位'}），爻本身為<b>${lt.isYang?'陽':'陰'}</b>。` +
    `${lt.proper
      ? '陽爻居陽位、或陰爻居陰位，稱為「當位」（得正）——處境的性質與位置相符，行事站得住腳，是結構上有利的細節。'
      : '爻的陰陽與所居爻位不合，稱為「不當位」（失正）——處境的性質與位置有落差，行事容易碰到名不正言不順的阻力，這是結構上不利的細節，不用美化它。'
    } ` +
    `${lt.isMiddle ? '此爻居於「中位」（六爻中的第二、第五爻），是相對有利的位置，即使不當位也能因居中而緩解。 ' : ''}` +
    `與之相應的是第 <b>${lt.pairPos}</b> 爻（<b>${lt.pairName}</b>）——` +
    `${lt.responds
      ? '兩爻陰陽相反，稱為「相應」，外部條件會配合，內外能呼應。'
      : '兩爻陰陽相同，稱為「不相應」，目前缺乏外部呼應，得靠自己主動推動，不會有人自動配合。'
    }` +
    `<br><br>爻辭原文「${ciText}」裡的判斷字（見上方標註）意思是固定的、有明確依據；但爻辭中間那些具體物象（例如卦裡提到的動作或情境）是三千年前的比喻寫法，逐句直翻容易失真，這裡不做無根據的字面翻譯，改用${q ? `你問的「${q}」對照` : '結構分析對照'}上面「當位／中位／相應」與體用生克算出的<b>${vb.label}</b>來下判斷——這是卦象裡確定、算得出來的部分。`;

  // 詳細推算過程
  const upperRaw = upperSum % 8;
  const lowerRaw = lowerSum % 8;
  const moveRaw = moveSum % 6;
  const calcHtml = `
    <div class="calc-step">
      <div class="calc-label">① 換算農曆${timeMode==='custom' ? '（自訂時間）' : '（當下時間）'}</div>
      <div class="calc-eq">國曆 ${solarY} 年 ${solarM} 月 ${solarD} 日 ${pad(now.getHours())}:${pad(now.getMinutes())}　→　農曆 <b>${ganZhiYear(year)}年</b> ${cnMonthDay(month,day,lunar.isLeap)}（${BRANCHES[hourNum-1]}時）</div>
    </div>
    <div class="calc-step">
      <div class="calc-label">② 年支數</div>
      <div class="calc-eq">(農曆年 − 3) mod 12 = (${year} − 3) mod 12 = ${(year-3)%12===0?'0 → 12':(year-3)%12}　→　年支數 <b>${yearBranch}</b></div>
    </div>
    <div class="calc-step">
      <div class="calc-label">③ 上卦（外卦）</div>
      <div class="calc-eq">(年支數 + 月 + 日) mod 8 = (${yearBranch} + ${month} + ${day}) mod 8 = ${upperSum} mod 8 = ${upperRaw===0?'0 → 8':upperRaw}</div>
      <div class="calc-eq">先天卦數 ${upperIdx}　→　上卦為 <b>${upper.name} ${upper.symbol}</b></div>
    </div>
    <div class="calc-step">
      <div class="calc-label">④ 下卦（內卦）</div>
      <div class="calc-eq">(年支數 + 月 + 日 + 時支數) mod 8 = (${yearBranch} + ${month} + ${day} + ${hourNum}) mod 8 = ${lowerSum} mod 8 = ${lowerRaw===0?'0 → 8':lowerRaw}</div>
      <div class="calc-eq">先天卦數 ${lowerIdx}　→　下卦為 <b>${lower.name} ${lower.symbol}</b></div>
    </div>
    <div class="calc-step">
      <div class="calc-label">⑤ 動爻</div>
      <div class="calc-eq">(年支數 + 月 + 日 + 時支數) mod 6 = ${moveSum} mod 6 = ${moveRaw===0?'0 → 6':moveRaw}　→　<b>第 ${moveLine} 爻</b>變</div>
    </div>
    <div class="calc-step">
      <div class="calc-label">⑥ 組成本卦</div>
      <div class="calc-eq">${upper.name}（上）+ ${lower.name}（下）　→　<b>${guaName(upperIdx,lowerIdx)}</b></div>
    </div>
    <div class="calc-step">
      <div class="calc-label">⑦ 應期（數字法）</div>
      <div class="calc-eq">用卦先天數 + 動爻數 = ${yongIdx} + ${moveLine} = <b>${vb.N}</b></div>
      <div class="calc-eq">以起卦時間 ${fmtDate(now)} 往後推 ${vb.N} 天　→　約在 <b>${fmtDate(vb.numDate)}（週${fmtWeekday(vb.numDate)}）</b></div>
    </div>
    <div class="calc-step">
      <div class="calc-label">⑧ 應期（干支法）</div>
      <div class="calc-eq">用卦「${yong.name}」屬${yong.el}，對應地支：${BRANCH_TARGETS[yong.el].join('、')}</div>
      <div class="calc-eq">自起卦時間起，往後逐日檢查地支，第一個符合者為 ${fmtDate(now)} + ${vb.ed?vb.ed.offset:'—'} 天　→　<b>${vb.ed?`${fmtDate(vb.ed.date)}（${vb.ed.stem}${vb.ed.branch}日）`:'—'}</b></div>
    </div>
    <div class="calc-step">
      <div class="calc-label">⑨ 應期（五行旺相法）</div>
      <div class="calc-eq">用卦「${yong.name}」屬${yong.el}，當旺月份：農曆${ELEMENT_MONTHS[yong.el].join('、')}月</div>
      <div class="calc-eq">目前農曆 ${month} 月，距離當旺還有 <b>${nearestSeasonMonth(month, yong.el).monthsAway} 個月</b>　→　約農曆 <b>${nearestSeasonMonth(month, yong.el).month} 月（${MONTH_BRANCH[nearestSeasonMonth(month, yong.el).month]}月）</b></div>
    </div>
    <div class="calc-note">先天八卦數：乾1・兌2・離3・震4・巽5・坎6・艮7・坤8（相除餘0時取該數，即8或6）。上卦決定於「年支＋月＋日」，下卦再加「時支數」；動爻另以除6取餘定位。應期三法（數字法／干支法／五行旺相法）為梅花易數常見的交叉驗證方式，三者互相印證，取其中較一致或較近的時間點參考，不同流派對單位（日／月／年）的取捨仍有出入。</div>
  `;
  document.getElementById('calcPanel').innerHTML = calcHtml;

  // lines animation
  const linesCol = document.getElementById('lines');
  linesCol.innerHTML='';
  full.forEach((v,i)=>{
    const yao = document.createElement('div');
    yao.className = 'yao' + ((i+1)===moveLine?' moving':'');
    if(v===1){
      yao.innerHTML = `<div class="bar" style="left:0;width:0"></div>`;
    } else {
      yao.innerHTML = `<div class="bar left" style="width:0"></div><div class="bar right" style="width:0"></div>`;
    }
    if((i+1)===moveLine){
      const mark = document.createElement('span');
      mark.className='mark'; mark.textContent='○';
      yao.appendChild(mark);
    }
    linesCol.appendChild(yao);
  });

  // trigger draw animation staggered bottom to top
  requestAnimationFrame(()=>{
    const yaos = linesCol.querySelectorAll('.yao');
    yaos.forEach((yao,i)=>{
      setTimeout(()=>{
        const bars = yao.querySelectorAll('.bar');
        bars.forEach(b=>{ b.style.width = bars.length===1 ? '150px' : '66px'; });
      }, i*140);
    });
  });

  document.getElementById('seal').classList.remove('show');
  void document.getElementById('seal').offsetWidth;
  document.getElementById('seal').classList.add('show');

  await saveHistoryRecord({
    savedAt: new Date().toISOString(),
    castTimeMode: timeMode,
    castLabel: `${solarY}/${solarM}/${pad(solarD)} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    lunarLabel: `${ganZhiYear(year)}年 ${cnMonthDay(month,day,lunar.isLeap)}`,
    question: q,
    category: activeCat,
    guaName: guaName(upperIdx,lowerIdx),
    upperName: upper.name,
    lowerName: lower.name,
    changedGuaName: guaName(cUpperIdx,cLowerIdx),
    tiName: ti.name,
    tiEl: ti.el,
    yongName: yong.name,
    yongEl: yong.el,
    relation: rel.rel,
    moveLine: moveLine,
    verdictLabel: vb.label,
    decisionVerdict: vb.decisionVerdict,
    verdictCls: vb.cls,
    numDateISO: vb.numDate.toISOString(),
    edDateISO: vb.ed ? vb.ed.date.toISOString() : null,
    edLabel: vb.ed ? `${vb.ed.stem}${vb.ed.branch}日` : null
  });

  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'nearest'});
  refreshRecords();
}

// ==================== 占卜紀錄（本機 localStorage ／ 登入後改用 Firestore 雲端） ====================
const HISTORY_KEY = 'meihua_records_v1';
let storageAvailable = true;
try{
  const t = '__meihua_test__';
  localStorage.setItem(t,'1'); localStorage.removeItem(t);
}catch(e){ storageAvailable = false; }

let cachedRecords = [];

function loadLocalHistory(){
  if(!storageAvailable) return [];
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function persistLocalHistory(arr){
  if(!storageAvailable) return;
  try{
    localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
  }catch(e){ console.error('儲存紀錄失敗', e); }
}

function recordsCollection(){
  return collection(db, 'users', currentUser.uid, 'records');
}

async function fetchAllRecords(){
  if(currentUser){
    try{
      const snap = await getDocs(recordsCollection());
      const arr = [];
      snap.forEach(d => arr.push(d.data()));
      arr.sort((a,b) => (b.savedAt||'').localeCompare(a.savedAt||''));
      return arr;
    }catch(e){
      console.error('讀取雲端紀錄失敗', e);
      return [];
    }
  }
  return loadLocalHistory();
}

async function saveHistoryRecord(rec){
  rec.id = Date.now() + '_' + Math.random().toString(36).slice(2,8);
  if(currentUser){
    try{
      await setDoc(doc(recordsCollection(), rec.id), rec);
    }catch(e){ console.error('雲端儲存失敗', e); }
  } else {
    if(!storageAvailable) return;
    const arr = loadLocalHistory();
    arr.unshift(rec);
    if(arr.length > 300) arr.length = 300;
    persistLocalHistory(arr);
  }
}

async function deleteHistoryRecord(id){
  if(currentUser){
    try{ await deleteDoc(doc(recordsCollection(), id)); }
    catch(e){ console.error('雲端刪除失敗', e); }
  } else {
    const arr = loadLocalHistory().filter(r => r.id !== id);
    persistLocalHistory(arr);
  }
  await refreshRecords();
}

async function clearAllHistory(){
  if(currentUser){
    try{
      const snap = await getDocs(recordsCollection());
      const batch = writeBatch(db);
      snap.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }catch(e){ console.error('雲端清空失敗', e); }
  } else {
    persistLocalHistory([]);
  }
  await refreshRecords();
}

function fmtSavedAt(iso){
  const d = new Date(iso);
  return `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())} 記錄`;
}
function fmtShortDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

async function refreshRecords(){
  cachedRecords = await fetchAllRecords();
  renderHistoryList(document.getElementById('historySearch').value);
}

function renderHistoryList(filterText){
  const listEl = document.getElementById('historyList');
  const countEl = document.getElementById('historyCount');
  const all = cachedRecords;
  const kw = (filterText||'').trim().toLowerCase();
  const filtered = kw ? all.filter(r =>
    (r.question||'').toLowerCase().includes(kw) ||
    (r.guaName||'').toLowerCase().includes(kw) ||
    (r.category||'').toLowerCase().includes(kw) ||
    (r.changedGuaName||'').toLowerCase().includes(kw)
  ) : all;

  const sourceNote = currentUser ? '（雲端同步）' : '（僅存本機）';
  countEl.textContent = storageAvailable || currentUser
    ? `共 ${all.length} 筆紀錄${sourceNote}${kw?`，符合搜尋 ${filtered.length} 筆`:''}`
    : '此瀏覽器無法使用本機儲存，紀錄僅存在於本次畫面中';

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="hist-empty">${all.length===0 ? '尚無占卜紀錄，起一卦之後會自動保存在這裡。' : '沒有符合搜尋條件的紀錄。'}</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(r => `
    <div class="hist-card" data-id="${r.id}">
      <div class="hist-head">
        <div>
          <div class="hist-gua">${r.guaName}<span class="arrow">→</span>${r.changedGuaName}</div>
          <div class="hist-when">${fmtSavedAt(r.savedAt)}　|　起卦時間：${r.castLabel}（${r.lunarLabel}）</div>
        </div>
        <div class="hist-badges">
          ${r.category ? `<span class="hist-tag">${r.category}</span>` : ''}
          <span class="hist-lv ${r.verdictCls}">${r.verdictLabel}</span>
          <span class="hist-del" title="刪除這筆紀錄" data-del="${r.id}">✕</span>
        </div>
      </div>
      <div class="hist-q ${r.question?'':'empty'}">${r.question ? '所問：' + escapeHtml(r.question) : '（未填寫具體問題）'}</div>
      <div class="hist-detail">
        決策建議：<b>${escapeHtml(r.decisionVerdict||'—')}</b><br>
        體用：<b>${r.tiName}</b>（${r.tiEl}）／<b>${r.yongName}</b>（${r.yongEl}）－${r.relation}　|　動爻：第${r.moveLine}爻　|　
        應期：<b>${fmtShortDate(r.numDateISO)}</b>${r.edLabel ? `、<b>${fmtShortDate(r.edDateISO)}</b>（${r.edLabel}）` : ''}
      </div>
    </div>
  `).join('');
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('historySearch').addEventListener('input', (e)=>{
  renderHistoryList(e.target.value);
});
document.getElementById('historyList').addEventListener('click', (e)=>{
  const delId = e.target.getAttribute('data-del');
  if(delId) deleteHistoryRecord(delId);
});
document.getElementById('historyClear').addEventListener('click', ()=>{
  if(cachedRecords.length === 0) return;
  if(confirm('確定要清空所有占卜紀錄嗎？此動作無法復原。')){
    clearAllHistory();
  }
});

async function migrateLocalToCloud(){
  const local = loadLocalHistory();
  if(local.length === 0 || !currentUser) return;
  authMigrate.textContent = `同步中…（0/${local.length}）`;
  let done = 0;
  for(const rec of local){
    try{
      await setDoc(doc(recordsCollection(), rec.id), rec);
    }catch(e){ console.error('同步失敗', rec.id, e); }
    done++;
    authMigrate.textContent = `同步中…（${done}/${local.length}）`;
  }
  persistLocalHistory([]);
  authMigrate.style.display = 'none';
  await refreshRecords();
}

onAuthStateChanged(auth, async (user)=>{
  currentUser = user;
  if(user){
    authStatus.textContent = `已登入：${user.displayName || user.email}`;
    authStatus.classList.add('signed-in');
    authBtn.textContent = '登出';
    authBtn.classList.add('signed-in');

    const local = loadLocalHistory();
    if(local.length > 0){
      authMigrate.style.display = 'inline';
      authMigrate.textContent = `同步本機 ${local.length} 筆紀錄到雲端`;
      authMigrate.onclick = migrateLocalToCloud;
    } else {
      authMigrate.style.display = 'none';
    }
  } else {
    authStatus.textContent = '尚未登入・紀錄僅存在本機瀏覽器';
    authStatus.classList.remove('signed-in');
    authBtn.textContent = '使用 Google 登入';
    authBtn.classList.remove('signed-in');
    authMigrate.style.display = 'none';
  }
  await refreshRecords();
});

// ==================== 分頁切換 ====================
document.querySelectorAll('.nav-tab').forEach(tab=>{
  tab.addEventListener('click', async ()=>{
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.getElementById('castView').style.display = target==='cast' ? 'block' : 'none';
    document.getElementById('historyView').style.display = target==='history' ? 'block' : 'none';
    if(target==='history') await refreshRecords();
  });
});


</script>
